name: Build PayNora Mobile APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Scaffold Platform Wrappers if needed
        working-directory: ./apps/mobile
        run: |
          if [ ! -d "android" ]; then
            echo "Scaffolding Android and iOS project files..."
            flutter create . --project-name paynora_mobile --org com.paynora.app --platforms android,ios
          fi

      - name: Install Dependencies
        working-directory: ./apps/mobile
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./apps/mobile
        run: flutter build apk --release --no-tree-shake-icons --build-name=1.2.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PayNora-v1.2.${{ github.run_number }}-release.apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Prepare Named APK
        run: |
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk apps/mobile/build/app/outputs/flutter-apk/PayNora.apk
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk apps/mobile/build/app/outputs/flutter-apk/PayNora-v1.2.${{ github.run_number }}.apk

      - name: Release Latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PayNora Mobile Latest Release (v1.2.${{ github.run_number }})
          body: "Official PayNora Mobile Release APK (v1.2.${{ github.run_number }}) with App-to-App (P2P) + Bank + Mobile Money International Transfers, Default USD & GBP Foreign Wallets, Local Bank Transfers, and Airtime/Data/Electricity Bills."
          files: |
            apps/mobile/build/app/outputs/flutter-apk/PayNora.apk
            apps/mobile/build/app/outputs/flutter-apk/PayNora-v1.2.${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
