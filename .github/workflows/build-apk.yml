name: Build PayNora Mobile APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Scaffold Platform Wrappers if needed
        working-directory: ./apps/mobile
        run: |
          if [ ! -d "android" ]; then
            echo "Scaffolding Android and iOS project files..."
            flutter create . --project-name paynora_mobile --org com.paynora.app --platforms android,ios
          fi

      - name: Install Dependencies
        working-directory: ./apps/mobile
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./apps/mobile
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PayNora-v1.0.0-release.apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
